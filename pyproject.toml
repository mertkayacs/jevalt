[project]
name = "jevalt"
version = "0.1.0"
description = "Open, local decision models with the Jev contract: typed Choice, Score and Noul answers with calibrated probabilities, optional reasoning, 4 GB RAM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Mert Kaya" }]
keywords = ["jev", "decision-model", "calibration", "llm", "classification", "typesafe", "system-one", "local-ai", "gguf", "turkish", "german"]
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
gguf = ["llama-cpp-python>=0.3"]
hf = ["torch>=2.6", "transformers>=5.0", "accelerate>=1.0"]
data = ["httpx>=0.27", "datasketch>=1.6", "babel>=2.14", "fasttext-predict>=0.9.2", "tokenizers>=0.20", "huggingface-hub>=0.25", "pyarrow>=15"]
dev = ["pytest>=8", "jinja2>=3.1"]

[project.scripts]
jevalt = "jevalt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevalt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
