name: Model result question
description: Ask about an unexpected decision, probability or unknown answer.
title: "[Model result]: "
body:
  - type: markdown
    attributes:
      value: Share a minimal example without API keys, bearer tokens, credentials or personal data. A surprising model answer is not necessarily a software bug.
  - type: input
    id: model
    attributes:
      label: Model and revision
      description: Include the backend and GGUF filename when applicable.
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Language and request settings
      description: Include reasoning, abstain and coverage settings, plus the JevAlt version or commit.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Sanitized request
      description: Include the state, question and options needed to reproduce the result.
      render: json
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Sanitized response
      description: Include the chosen answer and returned probabilities.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected answer and deciding fact
      description: Explain what you expected and which fact or rule supports it.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe to share
      options:
        - label: I removed credentials and personal data from this report.
          required: true
